services:
  backend:
    gpus:
      - driver: nvidia
        count: all
    build:
      context: ./backend
      args:
        INSTALL_EASYEDIT: ${INSTALL_EASYEDIT:-false}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/workbench.db
      DATA_DIR: ./data
      EASYEDIT_ROOT: /opt/EasyEdit
      EDITING_RUNTIME: easyedit
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend