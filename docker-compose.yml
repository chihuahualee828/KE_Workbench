services:
  backend:
    image: ${WORKBENCH_IMAGE_PREFIX:-ghcr.io/chihuahualee828/ke_workbench}-backend:${WORKBENCH_IMAGE_TAG:-latest}
    # NVIDIA PC: use gpus: all to expose the GPU; the backend then selects CUDA.
    # Mac (MPS host) / CPU-only host: comment out gpus: all to run Docker on CPU.
    gpus: all
    build:
      context: ./backend
      target: runtime
      args:
        INSTALL_EASYEDIT: ${INSTALL_EASYEDIT:-true}
      labels:
        org.opencontainers.image.source: https://github.com/chihuahualee828/KE_Workbench
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////app/data/workbench.db
      DATA_DIR: /app/data
      EASYEDIT_ROOT: /opt/EasyEdit
      EDITING_RUNTIME: easyedit
      HF_TOKEN: ${HF_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HF_HUB_CACHE: /hf-cache
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ${HF_CACHE_HOST_DIR:-./data/huggingface/hub}:/hf-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: ${WORKBENCH_IMAGE_PREFIX:-ghcr.io/chihuahualee828/ke_workbench}-frontend:${WORKBENCH_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      labels:
        org.opencontainers.image.source: https://github.com/chihuahualee828/KE_Workbench
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
