[project]
name = "knowledge-editing-workbench-backend"
version = "0.1.0"
description = "FastAPI backend for an interactive LLM knowledge editing workbench"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0",
  "safetensors>=0.4.3",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
ml = [
  "huggingface-hub>=0.23.0",
  "torch>=2.3.0",
  "transformers>=4.41.0",
  "accelerate>=0.30.0",
  "safetensors>=0.4.3",
]
worker = [
  "celery>=5.4.0",
  "redis>=5.0.0",
]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "*.egg-info*"]

[tool.ruff]
line-length = 100
target-version = "py310"
